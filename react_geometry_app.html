        const { useState, useEffect, useRef } = React;

        // ====================================================================
        // DEFENSIVE JSXGRAPH BOARD CLEANUP HELPER
        // ====================================================================
        function safeFreeJSXGraphBoard(board) {
            if (!board) return;
            try {
                if (board.resizeObserver) {
                    try { board.resizeObserver.disconnect(); } catch (e) {}
                }
                board.resizeContainer = function() {};
                board.updateContainerDims = function() {};
                if (window.JXG && window.JXG.JSXGraph && typeof window.JXG.JSXGraph.freeBoard === 'function') {
                    window.JXG.JSXGraph.freeBoard(board);
                }
            } catch (e) {
                console.warn('[JSXGraph] safeFreeJSXGraphBoard caught:', e);
            }
        }

                    { type: 'segment', id: 'AC', points: ['A', 'C'], color: '#94a3b8', width: 1.5, dash: 2 },
                    { type: 'segment', id: 'BD', points: ['B', 'D'], color: '#94a3b8', width: 1.5, dash: 2 }
                ]
            },
            parabola: {
                title: "Khảo sát Đồ thị Parabol y = x² & Đường thẳng (d)",
                formula: "y = x² | (d): y = 2x + 3 | A(-1; 1), B(3; 9)",
                desc: "Hàm số bậc hai và tương giao đồ thị. Tự động tính toán nghiệm toạ độ chính xác.",
                options: { boundingbox: [-6, 12, 6, -4], axis: true, grid: true },
                steps: [
                    { type: 'functiongraph', id: 'p', fn: 'x*x', color: '#ec4899', width: 2.5 },
                    { type: 'functiongraph', id: 'd', fn: '2*x + 3', color: '#38bdf8', width: 2.0 },
                    { type: 'point', id: 'A', coords: [-1, 1], name: 'A(-1, 1)', fixed: true, color: '#f43f5e' },
                    { type: 'point', id: 'B', coords: [3, 9], name: 'B(3, 9)', fixed: true, color: '#f43f5e' }
                ]
            }
        };

        // ====================================================================
        // TIER 1: GEMINI AI GEOMETRY COMPILER (Bóc tách ngữ nghĩa & JSON Parser)
        // ====================================================================
        const STRICT_GEOMETRY_SYSTEM_PROMPT = `Bạn là trình biên dịch hình học. Tuyệt đối không phỏng đoán tọa độ (x,y) không gian. Hãy đọc đề bài và trả về kịch bản dựng hình bằng định dạng JSON thuần túy. Ví dụ: [{"type": "point", "id": "A"}, {"type": "line", "points": ["A", "B"]}]. Không giải thích, không output thêm text ngoài JSON.`;

        // Bóc tách an toàn chuỗi JSON từ AI, loại bỏ markdown code fences
        function extractAndParseGeometryJson(rawText) {
            if (!rawText || typeof rawText !== 'string') {
                throw new Error('Dữ liệu từ AI rỗng hoặc không đúng định dạng.');
            }
            let cleaned = rawText.trim();
            cleaned = cleaned.replace(/^```(?:json)?\s*/i, '');
            cleaned = cleaned.replace(/\s*```$/i, '').trim();

            const firstBracket = cleaned.indexOf('[');
            const lastBracket = cleaned.lastIndexOf(']');
            if (firstBracket !== -1 && lastBracket !== -1 && lastBracket > firstBracket) {
                cleaned = cleaned.substring(firstBracket, lastBracket + 1);
            } else {
                const firstBrace = cleaned.indexOf('{');
                const lastBrace = cleaned.lastIndexOf('}');
                if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
                    cleaned = cleaned.substring(firstBrace, lastBrace + 1);
                }
            }

            const parsed = JSON.parse(cleaned);
            let steps = [];
            if (Array.isArray(parsed)) steps = parsed;
            else if (parsed && Array.isArray(parsed.steps)) steps = parsed.steps;
            else if (parsed && Array.isArray(parsed.construction)) steps = parsed.construction;
            else throw new Error('Cấu trúc JSON không chứa mảng các bước dựng hình [].');

            if (steps.length === 0) throw new Error('Mảng bước dựng hình trống rỗng.');
            return steps;
        }

        // Gọi Gemini API với cơ chế tự động thử lại (Retry Loop) chống ảo giác
        async function compileGeometryWithGemini(userPrompt, onStatus = null, maxRetries = 2) {
            const apiKey = (window.ENV && window.ENV.VITE_GEMINI_API_KEY)
                || localStorage.getItem('padlet_gemini_api_key')
                || localStorage.getItem('VITE_GEMINI_API_KEY')
                || '';

            if (!apiKey) {
                throw new Error('Chưa cấu hình Gemini API Key. Vui lòng nhập khóa API.');
            }

            let attempt = 0;
            let currentPrompt = userPrompt.trim();
            let lastError = null;

            while (attempt <= maxRetries) {
                attempt++;
                try {
                    if (onStatus) {
                        if (attempt === 1) onStatus('🧠 Đang gửi đề bài lên Gemini API (Tier 1)...');
                        else onStatus(`🔄 AI sinh sai cấu trúc, đang tự động Retry (Lần ${attempt - 1}/${maxRetries})...`);
                    }

                    let textResponse = '';

                    // 1. Thử gọi qua SDK @google/generative-ai
                    if (window.GoogleGenerativeAI) {
                        try {
                            const genAI = new window.GoogleGenerativeAI(apiKey);
                            const model = genAI.getGenerativeModel({
                                model: 'gemini-1.5-flash',
                                systemInstruction: STRICT_GEOMETRY_SYSTEM_PROMPT,
                                generationConfig: {
                                    responseMimeType: 'application/json',
                                    temperature: 0.1
                                }
                            });
                            const result = await model.generateContent(currentPrompt);
                            const res = await result.response;
                            textResponse = res.text();
                        } catch (sdkErr) {
                            console.warn('[SDK Call Error, falling back to REST]:', sdkErr);
                        }
                    }

                    // 2. Fallback sang Google Generative Language REST Endpoint nếu SDK chưa sẵn sàng
                    if (!textResponse) {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 12000);

                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            signal: controller.signal,
                            body: JSON.stringify({
                                systemInstruction: {
                                    parts: [{ text: STRICT_GEOMETRY_SYSTEM_PROMPT }]
                                },
                                contents: [{ role: 'user', parts: [{ text: currentPrompt }] }],
                                generationConfig: {
                                    responseMimeType: 'application/json',
                                    temperature: 0.1
                                }
                            })
                        });

                        clearTimeout(timeoutId);

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(errData.error?.message || `HTTP ${response.status}`);
                        }

                        const data = await response.json();
                        textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    }

                    if (!textResponse) throw new Error('Phản hồi từ Gemini rỗng.');

                    if (onStatus) onStatus('🔍 Đang bóc tách JSON & thẩm định tính hợp lệ...');
                    const validatedSteps = extractAndParseGeometryJson(textResponse);
                    return validatedSteps;

                } catch (err) {
                    lastError = err;
                    console.warn(`[Gemini Geometry] Lần thử ${attempt} thất bại:`, err.message);

                    if (attempt <= maxRetries) {
                        currentPrompt = `Phản hồi vừa rồi bị lỗi cú pháp hoặc cấu trúc: "${err.message}".
Yêu cầu bắt buộc sửa lại:
- Đề bài: "${userPrompt.trim()}"
- CHỈ xuất mảng JSON thuần túy [ { "type": "point", "id": "A" }, ... ].
- Tuyệt đối không phỏng đoán tọa độ canvas, không giải thích, không kèm text ngoài JSON.`;
                    }
                }
            }

            throw lastError || new Error('Không thể bóc tách JSON hợp lệ từ Gemini');
        }

        // ====================================================================
        // TIER 1: HÀM XỬ LÝ PHẢN HỒI CỦA AI CHATBOT (PARSER & STATE DISPATCHER)
        // QUY TẮC CỐT LÕI:
        // - Hàm này TUYỆT ĐỐI KHÔNG ĐƯỢC GỌI JXG.JSXGraph.initBoard hay thao tác DOM.
        // - Nhiệm vụ DUY NHẤT: Bóc tách Prompt thành object JSON toán học chuẩn.
        // ====================================================================
        function parseAiMathPromptToJson(promptText) {
            const lower = (promptText || '').toLowerCase();
            let templateKey = 'right_triangle';

            if (lower.includes('ngoại tiếp') || lower.includes('nội tiếp đường tròn') || lower.includes('bán kính r')) {
                templateKey = 'circumcircle';
            } else if (lower.includes('đường tròn nội tiếp') || lower.includes('ngoại tiếp tam giác') || lower.includes('phân giác')) {
                templateKey = 'incircle';
            } else if (lower.includes('tiếp tuyến') || lower.includes('tiếp xúc')) {
                templateKey = 'tangents';
            } else if (lower.includes('tứ giác') && (lower.includes('nội tiếp') || lower.includes('đường tròn'))) {
                templateKey = 'cyclic_quad';
            } else if (lower.includes('parabol') || lower.includes('đồ thị') || lower.includes('hàm số')) {
                templateKey = 'parabola';
            } else if (lower.includes('vuông') || lower.includes('đường cao') || lower.includes('pytago')) {
                templateKey = 'right_triangle';
            }

            const tpl = GEOMETRY_TEMPLATES[templateKey];
            const newCardId = 'card-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);

            // Trả về thuần túy Object JSON chứa id, type, và data
            return {
                id: newCardId,
                type: 'geometry',
                isPinned: false,
                data: {
                    title: tpl.title,
                    desc: promptText ? `Đề bài: "${promptText}". ${tpl.desc}` : tpl.desc,
                    formula: tpl.formula,
                    steps: JSON.parse(JSON.stringify(tpl.steps)),
                    options: tpl.options
                }
            };
        }

        // ====================================================================
        // TIER 2: GEOMETRY ENGINE COMPILER (Hàm biên dịch kịch bản sang JSXGraph)
        // Nhận đối tượng board và mảng declarative steps, biên dịch tuần tự.
        // ====================================================================
        function renderDynamicGeometry(board, steps = []) {
            if (!board || !Array.isArray(steps)) return new Map();

            const registry = new Map();
            const resolve = (ref) => {
                if (!ref) return null;
                if (typeof ref === 'string') {
                    if (registry.has(ref)) return registry.get(ref);
                    for (const [k, v] of registry.entries()) {
                        if (v && v.name === ref) return v;
                    }
                    return ref;
                }
                if (Array.isArray(ref)) return ref.map(r => resolve(r));
                return ref;
            };

            const defaultPointColor = '#38bdf8';
            const defaultLineColor = '#60a5fa';
            const defaultCircleColor = '#f43f5e';
            const defaultHighlightColor = '#fbbf24';

            board.suspendUpdate();

            steps.forEach((step, index) => {
                if (!step || !step.type) return;
                const stepId = step.id || step.name || `step_${index}`;

                try {
                    let createdObj = null;

                    switch (step.type.toLowerCase()) {
                        case 'point': {
                            const coords = step.coords || [(Math.random() * 6 - 3), (Math.random() * 6 - 3)];
                            createdObj = board.create('point', coords, {
                                name: step.name || step.id || '',
                                size: step.size || 4,
                                strokeColor: '#ffffff',
                                fillColor: step.color || defaultPointColor,
                                highlightFillColor: defaultHighlightColor,
                                fixed: step.fixed === true || step.isFree === false,
                                visible: step.visible !== false
                            });
                            break;
                        }

                        case 'glider': {
                            const targetObj = resolve(step.target || step.on);
                            const coords = step.coords || [0, 0];
                            if (targetObj) {
                                createdObj = board.create('glider', [coords[0], coords[1], targetObj], {
                                    name: step.name || step.id || '',
                                    size: step.size || 4.5,
                                    strokeColor: '#ffffff',
                                    fillColor: step.color || defaultCircleColor,
                                    highlightFillColor: defaultHighlightColor,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'segment': {
                            const pts = resolve(step.points || [step.p1, step.p2]);
                            if (pts && pts.length >= 2 && pts[0] && pts[1]) {
                                createdObj = board.create('segment', pts, {
                                    name: step.name || '',
                                    strokeColor: step.color || defaultLineColor,
                                    strokeWidth: step.width || 2.4,
                                    dash: step.dash || 0,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'ray': {
                            const pts = resolve(step.points || [step.point1, step.point2]);
                            if (pts && pts.length >= 2 && pts[0] && pts[1]) {
                                createdObj = board.create('ray', [pts[0], pts[1]], {
                                    name: step.name || '',
                                    strokeColor: step.color || defaultLineColor,
                                    strokeWidth: step.width || 2
                                });
                            }
                            break;
                        }

                        case 'line': {
                            const pts = resolve(step.points || [step.p1, step.p2]);
                            if (pts && pts.length >= 2 && pts[0] && pts[1]) {
                                createdObj = board.create('line', pts, {
                                    name: step.name || '',
                                    strokeColor: step.color || defaultLineColor,
                                    strokeWidth: step.width || 1.8,
                                    dash: step.dash || 0,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'midpoint': {
                            const pts = resolve(step.points || [step.p1, step.p2]);
                            if (pts && pts.length >= 2 && pts[0] && pts[1]) {
                                createdObj = board.create('midpoint', pts, {
                                    name: step.name || '',
                                    size: 3.5,
                                    fillColor: step.color || '#10b981',
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'perpendicular': {
                            const baseLine = resolve(step.base || step.line);
                            const pt = resolve(step.point || step.through);
                            if (baseLine && pt) {
                                createdObj = board.create('perpendicular', [baseLine, pt], {
                                    name: step.name || '',
                                    strokeColor: step.color || '#94a3b8',
                                    strokeWidth: step.width || 1.6,
                                    dash: step.dash || 2,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'parallel': {
                            const baseLine = resolve(step.base || step.line);
                            const pt = resolve(step.point || step.through);
                            if (baseLine && pt) {
                                createdObj = board.create('parallel', [baseLine, pt], {
                                    name: step.name || '',
                                    strokeColor: step.color || '#94a3b8',
                                    strokeWidth: step.width || 1.6,
                                    dash: 2,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'bisector': {
                            const pts = resolve(step.points || [step.p1, step.vertex, step.p2]);
                            if (pts && pts.length >= 3) {
                                createdObj = board.create('bisector', pts, {
                                    name: step.name || '',
                                    strokeColor: step.color || '#f59e0b',
                                    strokeWidth: 1.8,
                                    dash: 2,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'perpendicularbisector': {
                            const pts = resolve(step.points || [step.p1, step.p2]);
                            if (pts && pts.length >= 2) {
                                createdObj = board.create('perpendicularbisector', pts, {
                                    name: step.name || '',
                                    strokeColor: step.color || '#94a3b8',
                                    strokeWidth: 1.8,
                                    dash: 2,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'intersection': {
                            const objs = resolve(step.objects || [step.obj1, step.obj2]);
                            const idx = step.index !== undefined ? step.index : 0;
                            if (objs && objs.length >= 2 && objs[0] && objs[1]) {
                                createdObj = board.create('intersection', [objs[0], objs[1], idx], {
                                    name: step.name || '',
                                    size: step.size || 4,
                                    strokeColor: '#ffffff',
                                    fillColor: step.color || '#10b981',
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'circle': {
                            const center = resolve(step.center || step.p1);
                            const pt = resolve(step.point || step.through || step.p2);
                            const radius = step.radius;

                            if (center && pt) {
                                createdObj = board.create('circle', [center, pt], {
                                    strokeColor: step.color || defaultCircleColor,
                                    strokeWidth: step.width || 2.4,
                                    dash: step.dash || 0,
                                    visible: step.visible !== false
                                });
                            } else if (center && typeof radius === 'number') {
                                createdObj = board.create('circle', [center, radius], {
                                    strokeColor: step.color || defaultCircleColor,
                                    strokeWidth: step.width || 2.4,
                                    dash: step.dash || 0,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'circumcircle': {
                            const pts = resolve(step.points || [step.p1, step.p2, step.p3]);
                            if (pts && pts.length >= 3 && pts[0] && pts[1] && pts[2]) {
                                createdObj = board.create('circumcircle', pts, {
                                    strokeColor: step.color || defaultCircleColor,
                                    strokeWidth: 2.4,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'incircle': {
                            const pts = resolve(step.points || [step.p1, step.p2, step.p3]);
                            if (pts && pts.length >= 3 && pts[0] && pts[1] && pts[2]) {
                                createdObj = board.create('incircle', pts, {
                                    strokeColor: step.color || '#10b981',
                                    strokeWidth: 2.2,
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'polygon': {
                            const pts = resolve(step.points || step.vertices);
                            if (pts && pts.length >= 3 && pts.every(p => p !== null)) {
                                createdObj = board.create('polygon', pts, {
                                    fillColor: step.fillColor || defaultPointColor,
                                    fillOpacity: step.fillOpacity !== undefined ? step.fillOpacity : 0.12,
                                    borders: {
                                        strokeColor: step.strokeColor || defaultLineColor,
                                        strokeWidth: step.strokeWidth || 2.2
                                    },
                                    visible: step.visible !== false
                                });
                            }
                            break;
                        }

                        case 'angle': {
                            const pts = resolve(step.points || [step.p1, step.vertex, step.p2]);
                            if (pts && pts.length >= 3 && pts[0] && pts[1] && pts[2]) {
                                const isRight = step.rightAngle === true || step.name === '90°';
                                createdObj = board.create('angle', pts, {
                                    type: isRight ? 'right' : (step.angleType || 'sector'),
                                    orthoType: 'square',
                                    orthoSensitivity: 1.0,
                                    radius: step.radius || 0.8,
                                    fillColor: isRight ? '#f43f5e' : '#f59e0b',
                                    fillOpacity: 0.2,
                                    strokeColor: isRight ? '#f43f5e' : '#d97706',
                                    strokeWidth: 1.8,
                                    name: isRight ? '' : (step.label || '')
                                });
                            }
                            break;
                        }

                        case 'tangent': {
                            const pt = resolve(step.point || step.glider);
                            const circ = resolve(step.circle);
                            if (pt && circ) {
                                createdObj = board.create('tangent', [pt, circ], {
                                    strokeColor: step.color || defaultLineColor,
                                    strokeWidth: 2
                                });
                            }
                            break;
                        }

                        case 'ticks': {
                            const targetObj = resolve(step.segment || step.target || step.line);
                            const count = step.count || step.num || 1;
                            if (targetObj) {
                                createdObj = board.create('ticks', [targetObj, count], {
                                    strokeColor: step.color || defaultLineColor,
                                    strokeWidth: step.width || 1.8,
                                    tickEndings: [0.5, 0.5]
                                });
                            }
                            break;
                        }

                        case 'functiongraph':
                        case 'curve': {
                            let fn = null;
                            if (typeof step.fn === 'function') {
                                fn = step.fn;
                            } else if (typeof step.fn === 'string') {
                                try { fn = new Function('x', `return ${step.fn};`); } catch (e) {}
                            }
                            if (fn) {
                                createdObj = board.create('functiongraph', [fn, step.range ? step.range[0] : -10, step.range ? step.range[1] : 10], {
                                    strokeColor: step.color || '#ec4899',
                                    strokeWidth: step.width || 2.5
                                });
                            }
                            break;
                        }

                        case 'text': {
                            const coords = step.coords || [0, 0];
                            createdObj = board.create('text', [coords[0], coords[1], step.text || ''], {
                                fontSize: step.fontSize || 13,
                                strokeColor: step.color || '#f8fafc'
                            });
                            break;
                        }

                        default:
                            break;
                    }

                    if (createdObj) registry.set(stepId, createdObj);
                } catch (err) {
                    console.error(`[JSXGraph] Lỗi dựng bước ${stepId}:`, err);
                }
            });

            board.unsuspendUpdate();
            board.update();
            return registry;
        }

        // ====================================================================
        // COMPONENT CARD HIỂN THỊ THẺ BÀI: DynamicGeometryCard
        // KHỞI TẠO AN TOÀN VỚI USEEFFECT VÀ THAM CHIẾU DOM BOARDREF
        // ====================================================================
        const DynamicGeometryCard = ({
            card,
            onDelete,
            onTogglePin,
            onSelect,
            isSelected = false
        }) => {
            // [Nhiệm vụ 3]: Tạo tham chiếu DOM với useRef
            const boardRef = useRef(null);
            const boardInstanceRef = useRef(null);
            const dynamicBoxId = `jxgbox-${card.id}`;

            // Đọc dữ liệu JSON từ props.card.data
            const geomData = card.data || {};
            const steps = geomData.steps || [];
            const options = geomData.options || {};
            const title = geomData.title || card.title || 'Thẻ bài hình học';
            const formula = geomData.formula || card.formula || '';
            const desc = geomData.desc || card.desc || '';

            // [Nhiệm vụ 3 & 4]: Luồng thực thi chuẩn bên trong useEffect
            useEffect(() => {
                // 1. Đầu useEffect, bắt buộc kiểm tra if (!boardRef.current) return;
                if (!boardRef.current) return;

                // Dọn dẹp bảng cũ nếu tồn tại
                if (boardInstanceRef.current) {
                    safeFreeJSXGraphBoard(boardInstanceRef.current);
                    boardInstanceRef.current = null;
                }

                // Cấu hình bảng vẽ
                const defaultOptions = {
                    boundingbox: options.boundingbox || [-7, 5.5, 7, -5.5],
                    axis: options.axis !== undefined ? options.axis : false,
                    grid: options.grid !== undefined ? options.grid : false,
                    showNavigation: false,
                    showCopyright: false,
                    keepaspectratio: true,
                    pan: { enabled: !card.isPinned, needShift: false },
                    zoom: { factorX: 1.25, factorY: 1.25, wheel: !card.isPinned, needShift: false },
                    ...options
                };

                // 2. Khởi tạo bảng vẽ dùng chính ID động hoặc tham chiếu DOM đó
                let board = null;
                try {
                    board = window.JXG.JSXGraph.initBoard(boardRef.current || dynamicBoxId, defaultOptions);
                    boardInstanceRef.current = board;
                } catch (err) {
                    console.error(`[JSXGraph] Lỗi khởi tạo initBoard cho "${dynamicBoxId}":`, err);
                    return;
                }

                // 3. Đọc dữ liệu JSON từ props.card.data và truyền vào hàm renderDynamicGeometry
                renderDynamicGeometry(board, steps);

                // 4. Trả về hàm cleanup gọi JXG.JSXGraph.freeBoard(board) khi component unmount hoặc re-render
                return () => {
                    if (boardInstanceRef.current) {
                        safeFreeJSXGraphBoard(boardInstanceRef.current);
                        boardInstanceRef.current = null;
                    }
                };
            }, [card.id, JSON.stringify(card.data), card.isPinned]);

            return (
                <div 
                    className={`rounded-2xl border transition-all flex flex-col overflow-hidden shadow-xl ${
                        isSelected 
                            ? 'bg-slate-900 border-sky-500 ring-2 ring-sky-500/30' 
                            : card.isPinned 
                                ? 'bg-slate-900/90 border-amber-500/50 ring-1 ring-amber-500/20' 
                                : 'bg-slate-900/80 border-slate-800 hover:border-slate-700'
                    }`}
                >
                    {/* Header Thẻ bài */}
                    <div className="p-3 border-b border-slate-800/80 flex items-center justify-between bg-slate-950/60 select-none">
                        <div className="flex items-center gap-2 overflow-hidden">
                            <span className={`w-2.5 h-2.5 rounded-full shrink-0 ${card.isPinned ? 'bg-amber-400 animate-pulse' : 'bg-sky-400'}`}></span>
                            <h3 className="text-xs font-bold text-white truncate" title={title}>
                                {title}
                            </h3>
                            {card.isPinned && (
                                <span className="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px] font-bold shrink-0 flex items-center gap-1">
                                    <i className="fa-solid fa-thumbtack text-[9px]"></i> Ghim
                                </span>
                            )}
                        </div>

                        <div className="flex items-center gap-1 shrink-0">
                            {/* Nút Ghim (Pin Component) */}
                            {onTogglePin && (
                                <button
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        onTogglePin(card.id);
                                    }}
                                    title={card.isPinned ? "Bỏ ghim (Mở khóa kéo thả)" : "Ghim vị trí (Khóa kéo thả)"}
                                    className={`w-7 h-7 rounded-lg flex items-center justify-center transition text-xs ${
                                        card.isPinned 
                                            ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' 
                                            : 'hover:bg-slate-800 text-slate-400 hover:text-amber-400'
                                    }`}
                                >
                                    <i className="fa-solid fa-thumbtack"></i>
                                </button>
                            )}

                            {/* Nút Xem chi tiết */}
                            {onSelect && (
                                <button
                                    onClick={() => onSelect(card.id)}
                                    title="Xem chi tiết & Chỉnh sửa kịch bản"
                                    className="w-7 h-7 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-sky-400 flex items-center justify-center transition text-xs"
                                >
                                    <i className="fa-solid fa-expand"></i>
                                </button>
                            )}

                            {/* Nút Xóa (Delete Callback) */}
                            {onDelete && (
                                <button
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        onDelete(card.id);
                                    }}
                                    title="Xóa thẻ bài khỏi Dashboard"
                                    className="w-7 h-7 rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition text-xs"
                                >
                                    <i className="fa-regular fa-trash-can"></i>
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Vùng Bảng vẽ JSXGraph: Gắn ref={boardRef} và id={`jxgbox-${card.id}`} */}
                    <div className="h-64 bg-slate-950 relative overflow-hidden">
                        <div 
                            ref={boardRef} 
                            id={dynamicBoxId} 
                            className="jxgbox w-full h-full relative" 
                            style={{ minHeight: '100%', width: '100%', height: '100%' }}
                        />
                        <div className="absolute top-2 right-2 px-2 py-0.5 rounded bg-slate-900/80 backdrop-blur-sm border border-slate-800 text-[10px] font-mono text-slate-400 pointer-events-none">
                            #{dynamicBoxId}
                        </div>
                    </div>

                    {/* Footer Thẻ bài */}
                    {(desc || formula) && (
                        <div className="p-3 bg-slate-900/60 border-t border-slate-800/60 text-xs">
                            {desc && <div className="text-slate-400 text-[11px] line-clamp-1 mb-1">{desc}</div>}
                            {formula && <div className="text-sky-400 font-mono text-[11px] truncate">{formula}</div>}
                        </div>
                    )}
                </div>
            );
        };


        // ====================================================================
        // LOGIN MODAL COMPONENT (GOOGLE OAUTH 2.0 & CHỈ CHẤP NHẬN GOOGLE)
        // ====================================================================
        const LoginModal = ({ isOpen = true, onSuccess }) => {
            if (!isOpen) return null;

            const [authError, setAuthError] = useState('');
            const [emailInput, setEmailInput] = useState('');
            const [nameInput, setNameInput] = useState('');
            const buttonRef = React.useRef(null);

            const getGoogleClientId = () => {
                if (window.ENV && window.ENV.VITE_GOOGLE_CLIENT_ID) {
                    return window.ENV.VITE_GOOGLE_CLIENT_ID.trim();
                }
                const stored = localStorage.getItem('padlet_google_client_id');
                if (stored && stored.trim() && !stored.includes('sampleclientid')) {
                    return stored.trim();
                }
                return '867845907918-8mt3p30up2f9hhrfs8o2rmmbr7f86gu3.apps.googleusercontent.com';
            };

            const clientId = getGoogleClientId();
            const isClientIdConfigured = Boolean(
                clientId && 
                clientId.length > 20 && 
                clientId.includes('.apps.googleusercontent.com') && 
                !clientId.includes('sampleclientid')
            );

            const isValidGoogleEmail = (email) => {
                if (!email) return false;
                const em = email.trim().toLowerCase();
                const parts = em.split('@');
                if (parts.length !== 2) return false;
                const domain = parts[1];
                return domain === 'gmail.com' || domain === 'googlemail.com' || domain === 'google.com' || domain.endsWith('.google.com');
            };

            const handleCredentialResponse = (credentialResponse) => {
                try {
                    const token = credentialResponse.credential;
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                    const payload = JSON.parse(jsonPayload);

                    if (!isValidGoogleEmail(payload.email)) {
                        setAuthError(`⛔ TỪ CHỐI TRUY CẬP: Hệ thống CHỈ CHẤP NHẬN tài khoản Google (@gmail.com hoặc Google Workspace)! Email "${payload.email}" không được phép.`);
                        return;
                    }

                    const user = {
                        sub: payload.sub,
                        name: payload.name || payload.email.split('@')[0],
                        email: payload.email.toLowerCase(),
                        picture: payload.picture,
                        token: token,
                        provider: 'google',
                        loginTime: Date.now()
                    };

                    // Lưu trữ cục bộ (Local Storage Persistence) chống Login Loop khi F5
                    localStorage.setItem('mathboard_user', JSON.stringify(user));
                    localStorage.setItem('padlet_google_user', JSON.stringify(user));

                    if (typeof onSuccess === 'function') {
                        onSuccess(user);
                    }
                } catch (err) {
                    console.error('[Google Auth] Lỗi xử lý callback:', err);
                    setAuthError('Không thể xử lý phản hồi từ Google. Vui lòng thử lại!');
                }
            };

            useEffect(() => {
                if (!isClientIdConfigured) return;
                let isMounted = true;
                const initGIS = () => {
                    if (window.google && window.google.accounts && window.google.accounts.id && buttonRef.current) {
                        try {
                            window.google.accounts.id.initialize({
                                client_id: clientId,
                                callback: handleCredentialResponse,
                                auto_select: false,
                                cancel_on_tap_outside: false
                            });
                            buttonRef.current.innerHTML = '';
                            window.google.accounts.id.renderButton(buttonRef.current, {
                                theme: 'outline',
                                size: 'large',
                                width: 300,
                                text: 'signin_with',
                                shape: 'pill',
                                logo_alignment: 'left'
                            });
                        } catch (e) {
                            console.warn('[GIS] Error:', e);
                        }
                    } else if (isMounted) {
                        setTimeout(initGIS, 350);
                    }
                };
                initGIS();
                return () => { isMounted = false; };
            }, [isClientIdConfigured, clientId]);

            const handleDirectLogin = (e) => {
                if (e) e.preventDefault();
                const em = emailInput.trim();
                if (!em) {
                    setAuthError('Vui lòng nhập địa chỉ email Google (@gmail.com)!');
                    return;
                }
                if (!isValidGoogleEmail(em)) {
                    setAuthError(`⛔ TỪ CHỐI: Hệ thống CHỈ CHẤP NHẬN tài khoản Google (@gmail.com hoặc Google Workspace)! Email "${em}" không hợp lệ.`);
                    return;
                }
                const name = nameInput.trim() || em.split('@')[0];
                const user = {
                    sub: 'gg_' + Math.abs(hashCode(em)),
                    name: name,
                    email: em.toLowerCase(),
                    picture: generateAvatar(name),
                    token: 'token_direct_' + Date.now(),
                    provider: 'google',
                    loginTime: Date.now()
                };

                localStorage.setItem('mathboard_user', JSON.stringify(user));
                localStorage.setItem('padlet_google_user', JSON.stringify(user));

                if (typeof onSuccess === 'function') {
                    onSuccess(user);
                }
            };

            const handleQuickLogin = (presetEmail, presetName) => {
                const user = {
                    sub: 'gg_' + Math.abs(hashCode(presetEmail)),
                    name: presetName,
                    email: presetEmail.toLowerCase(),
                    picture: generateAvatar(presetName),
                    token: 'token_quick_' + Date.now(),
                    provider: 'google',
                    loginTime: Date.now()
                };

                localStorage.setItem('mathboard_user', JSON.stringify(user));
                localStorage.setItem('padlet_google_user', JSON.stringify(user));

                if (typeof onSuccess === 'function') {
                    onSuccess(user);
                }
            };

            const hashCode = (str) => {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                return hash;
            };

            const generateAvatar = (name) => {
                const initial = (name || 'G').trim().charAt(0).toUpperCase();
                return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="32" fill="%234285F4"/><text x="50%" y="54%" font-family="sans-serif" font-size="28" font-weight="bold" fill="%23ffffff" dominant-baseline="middle" text-anchor="middle">${initial}</text></svg>`;
            };

            return (
                <div id="react-google-auth-modal" className="fixed inset-0 z-[9999] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl border border-slate-200/90 max-w-md w-full p-6 md:p-8 space-y-5 relative overflow-hidden animate-scale-in text-slate-800">
                        <div className="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-[#4285F4] via-[#EA4335] via-[#FBBC05] to-[#34A853]"></div>

                        <div className="text-center space-y-2">
                            <div className="w-14 h-14 mx-auto bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-center shadow-xs">
                                <svg className="w-8 h-8" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                                </svg>

                            <button

                        <div className="pt-2 border-t border-slate-100">

                                <button
                                    type="button"
                                    onClick={() => handleQuickLogin('gv.toan.nguyen@gmail.com', 'Thầy Nguyễn Văn Toàn (GV)')}
                                    className="p-2 bg-slate-50 hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 rounded-xl text-left transition flex items-center gap-2"
                                >
                                    <span className="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-[10px]">T</span>

                                        <p className="font-bold truncate text-[11px]">Thầy Toàn (GV)</p>
                                        <p className="text-[10px] text-slate-400 truncate">@gmail.com</p>
                                    </div>
                                </button>

                                <button
                                    type="button"
                                    onClick={() => handleQuickLogin('hocsinh.math9@gmail.com', 'Nguyễn Minh Khôi (Học sinh)')}
                                    className="p-2 bg-slate-50 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 rounded-xl text-left transition flex items-center gap-2"
                                >
                                    <span className="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-[10px]">K</span>
                                    <div className="overflow-hidden">
                                        <p className="font-bold truncate text-[11px]">Minh Khôi (HS)</p>
                                        <p className="text-[10px] text-slate-400 truncate">@gmail.com</p>
