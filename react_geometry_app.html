        };

        // ====================================================================
        // APP CHÍNH: MathBoard Dashboard (DECOUPLED ARCHITECTURE)
        // ====================================================================
        function App() {
            // [Nhiệm vụ 3]: State xác thực người dùng toàn cục
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            // [Nhiệm vụ 4]: Khôi phục phiên (Session Recovery) lúc tải trang để bypass màn hình đăng nhập
            useEffect(() => {
                const savedUser = localStorage.getItem('mathboard_user') || localStorage.getItem('padlet_google_user');
                if (savedUser) {
                    try {
                        const parsed = JSON.parse(savedUser);
                        if (parsed && (parsed.email || parsed.sub)) {
                            setCurrentUser(parsed);
                            setIsAuthenticated(true);
                        }
                    } catch (e) {
                        console.warn("[Session Recovery] Lỗi đọc session:", e);
                    }
                }
            }, []);

            const handleLoginSuccess = (user) => {
                localStorage.setItem('mathboard_user', JSON.stringify(user));
                localStorage.setItem('padlet_google_user', JSON.stringify(user));
                setCurrentUser(user);
                setIsAuthenticated(true);
            };

            const handleLogout = () => {
                localStorage.removeItem('mathboard_user');
                localStorage.removeItem('padlet_google_user');
                setCurrentUser(null);
                setIsAuthenticated(false);
            };
            const [chatPrompt, setChatPrompt] = useState('');
            const [isAiProcessing, setIsAiProcessing] = useState(false);
            const [aiStatusMsg, setAiStatusMsg] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [apiKeyInput, setApiKeyInput] = useState(
                localStorage.getItem('padlet_gemini_api_key') || 
                (window.ENV && window.ENV.VITE_GEMINI_API_KEY) || ''
            );

            // Global State chứa danh sách các thẻ bài
            const [cards, setCards] = useState([
                {
                    id: 'card-1',
                    type: 'geometry',
                    isPinned: false,
                    data: {
                        title: '1. Tam giác vuông ABC & Đường cao AH (Chuẩn xác 100%)',
                        desc: GEOMETRY_TEMPLATES.right_triangle.desc,
                        formula: GEOMETRY_TEMPLATES.right_triangle.formula,
                        steps: GEOMETRY_TEMPLATES.right_triangle.steps,
                        options: GEOMETRY_TEMPLATES.right_triangle.options
                    }
                },
                {
                    id: 'card-2',
                    type: 'geometry',
                    isPinned: true,
                    data: {
                        title: '2. Đường tròn ngoại tiếp tam giác ABC (O; R)',
                        desc: GEOMETRY_TEMPLATES.circumcircle.desc,
                        formula: GEOMETRY_TEMPLATES.circumcircle.formula,
                        steps: GEOMETRY_TEMPLATES.circumcircle.steps,
                        options: GEOMETRY_TEMPLATES.circumcircle.options
                    }
                },
                {
                    id: 'card-3',
                    type: 'geometry',
                    isPinned: false,
                    data: {
                        title: '3. Đường tròn nội tiếp tam giác ABC',
                        desc: GEOMETRY_TEMPLATES.incircle.desc,
                        formula: GEOMETRY_TEMPLATES.incircle.formula,
                        steps: GEOMETRY_TEMPLATES.incircle.steps,
                        options: GEOMETRY_TEMPLATES.incircle.options
                    }
                }
            ]);

            const [selectedCardId, setSelectedCardId] = useState('card-1');
            const [viewMode, setViewMode] = useState('dashboard'); // 'dashboard' | 'focus'
            const [jsonEditorContent, setJsonEditorContent] = useState('');
            const [jsonError, setJsonError] = useState(null);

            const activeCard = cards.find(c => c.id === selectedCardId) || cards[0];

            useEffect(() => {
                if (activeCard && activeCard.data) {
                    setJsonEditorContent(JSON.stringify(activeCard.data.steps, null, 2));
                    setJsonError(null);
                }
            }, [selectedCardId, activeCard]);

            // ================================================================
            // [Nhiệm vụ 1]: Ngăn chặn AI thao tác DOM (Decoupled State Handler)
            // Tuyệt đối KHÔNG gọi JXG.JSXGraph.initBoard.
            // Chỉ bóc tách JSON và đẩy vào Global State setCards(prev => [...prev, newCard])
            // ================================================================
            // ================================================================
            // TIER 1 -> TIER 2: DECOUPLED AI DISPATCHER VỚI AUTO-RETRY LOOP
            // ================================================================
            const handleAiChatbotSubmit = async (e, directPrompt = null) => {
                if (e && e.preventDefault) e.preventDefault();
                const text = (directPrompt !== null ? directPrompt : chatPrompt).trim();
                if (!text) return;

                setIsAiProcessing(true);
                setAiStatusMsg('🧠 Đang khởi tạo Tier 1 AI Parser...');

                try {
                    let steps = null;
                    let isOnlineAi = false;

                    // 1. Gửi prompt lên Gemini API với System Prompt nghiêm ngặt & Auto-Retry Loop
                    try {
                        steps = await compileGeometryWithGemini(text, (msg) => setAiStatusMsg(msg));
                        isOnlineAi = true;
                    } catch (aiErr) {
                        console.warn('[Tier 1 Gemini Fallback]:', aiErr.message);
                        setAiStatusMsg(`⚠️ Gemini API: ${aiErr.message}. Đang chuyển sang Smart Engine dự phòng...`);
                        
                        // Fallback an toàn sang Smart Built-in Engine để KHÔNG BAO GIỜ làm crash UI
                        const fallbackCard = parseAiMathPromptToJson(text);
                        steps = fallbackCard.data.steps;
                    }

                    if (!steps || !Array.isArray(steps) || steps.length === 0) {
                        throw new Error('Không nhận được các bước dựng hình hợp lệ.');
                    }

                    // 2. Đẩy trực tiếp mảng JSON vào React State (Tier 2 DynamicGeometryCard tự vẽ)
                    const newCardId = 'card-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
                    const newCard = {
                        id: newCardId,
                        type: 'geometry',
                        isPinned: false,
                        data: {
                            title: isOnlineAi ? `⚡ AI: ${text.substring(0, 32)}...` : `📐 ${text.substring(0, 32)}`,
                            desc: `Đề bài: "${text}". Biên dịch tự động qua ${isOnlineAi ? 'Gemini 1.5 Flash' : 'Smart Engine (Offline)'}`,
                            formula: `Kịch bản dựng hình JSXGraph gồm ${steps.length} bước khai báo tuần tự`,
                            steps: steps,
                            options: { boundingbox: [-7, 6, 7, -6], axis: false, grid: false }
                        }
                    };

                    setCards(prev => [...prev, newCard]);
                    setSelectedCardId(newCard.id);
                    setChatPrompt('');
                    setAiStatusMsg(isOnlineAi ? '🎉 Đã dựng hình thành công qua Gemini API!' : '✅ Đã dựng hình qua Smart Engine!');
                    setTimeout(() => setAiStatusMsg(''), 4000);

                } catch (err) {
                    console.error('[MathBoard AI Error]:', err);
                    setAiStatusMsg(`⚠️ Lỗi dựng hình: ${err.message}`);
                } finally {
                    setIsAiProcessing(false);
                }
            };

            // Thêm widget từ Template mẫu
            const handleAddWidget = (templateKey = 'tangents') => {
                const tpl = GEOMETRY_TEMPLATES[templateKey] || GEOMETRY_TEMPLATES.right_triangle;
                const newId = 'card-' + Date.now();
                const newCard = {
                    id: newId,
                    type: 'geometry',
                    isPinned: false,
                    data: {
                        title: `${cards.length + 1}. ${tpl.title}`,
                        desc: tpl.desc,
                        formula: tpl.formula,
                        steps: JSON.parse(JSON.stringify(tpl.steps)),
                        options: tpl.options
                    }
                };
                setCards(prev => [...prev, newCard]);
                setSelectedCardId(newId);
            };

            // Sinh đồng thời nhiều widget cùng lúc (Stress test kiểm tra độ ổn định)
            const handleBatchGenerate = () => {
                const keys = ['right_triangle', 'circumcircle', 'incircle', 'tangents'];
                const timestamp = Date.now();
                const newBatch = keys.map((k, idx) => {
                    const tpl = GEOMETRY_TEMPLATES[k];
                    return {
                        id: `batch-${timestamp}-${idx}`,
                        type: 'geometry',
                        isPinned: false,
                        data: {
                            title: `⚡ Batch #${idx + 1}: ${tpl.title}`,
                            desc: tpl.desc,
                            formula: tpl.formula,
                            steps: JSON.parse(JSON.stringify(tpl.steps)),
                            options: tpl.options
                        }
                    };
                });
                setCards(prev => [...prev, ...newBatch]);
            };

            // Xóa thẻ bài (Delete Callback)
            const handleDeleteCard = (cardId) => {
                setCards(prev => prev.filter(c => c.id !== cardId));
                if (selectedCardId === cardId) {
                    const remaining = cards.filter(c => c.id !== cardId);
                    if (remaining.length > 0) setSelectedCardId(remaining[0].id);
                }
            };

            // Ghim vị trí (Pin Component)
            const handleTogglePin = (cardId) => {
                setCards(prev => prev.map(c => c.id === cardId ? { ...c, isPinned: !c.isPinned } : c));
            };

            // Áp dụng JSON chỉnh sửa
            const handleApplyJson = () => {
                try {
                    const parsed = JSON.parse(jsonEditorContent);
                    if (!Array.isArray(parsed)) throw new Error("JSON phải là một mảng [] các bước dựng hình.");
                    setCards(prev => prev.map(c => {
                        if (c.id === selectedCardId) {
                            return {
                                ...c,
                                data: { ...c.data, steps: parsed }
                            };
                        }
                        return c;
                    }));
                    setJsonError(null);
                } catch (err) {
                    setJsonError(err.message);
                }
            };

            return (
                <div className="flex flex-col flex-1 h-screen overflow-hidden relative">
                    {/* [Nhiệm vụ 3]: CONDITIONAL RENDERING MODAL ĐĂNG NHẬP (Tự biến mất khi isAuthenticated = true) */}
                    {!isAuthenticated && (
                        <LoginModal onSuccess={handleLoginSuccess} />
                    )}

                    {/* Header */}
                    <header className="h-16 px-6 bg-slate-900 border-b border-slate-800 flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/20 text-lg font-bold">
                                <i className="fa-solid fa-layer-group"></i>
                            </div>
                            <div>
                                <h1 className="text-base font-extrabold text-white tracking-tight flex items-center gap-2">
                                    MathBoard AI <span className="text-sky-400">Decoupled Architecture</span>
                                    <span className="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 text-[10px] font-mono border border-emerald-500/30">
                                        Tier 1 & Tier 2 Decoupled
                                    </span>
                                </h1>
                                <p className="text-xs text-slate-400">
                                    AI chỉ cập nhật State (setCards) • DynamicGeometryCard tự chủ động mount & vẽ
                                </p>
                            </div>
                        </div>

                        {/* Top Controls */}
                        <div className="flex items-center gap-3">
                            {/* Gemini API Key Status & Trigger Modal */}
                            {apiKeyInput ? (
                                <button
                                    onClick={() => setIsSettingsOpen(true)}
                                    className="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5 hover:bg-emerald-500/20 transition"
                                    title="Gemini API Key đang hoạt động. Nhấn để thay đổi"
                                >
                                    <i className="fa-solid fa-bolt text-emerald-400"></i>
                                    <span>Gemini Flash Active</span>
                                </button>
                            ) : (
                                <button
                                    onClick={() => setIsSettingsOpen(true)}
                                    className="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700 flex items-center gap-1.5 hover:bg-slate-700 transition"
                                    title="Nhập Gemini API Key để kích hoạt AI bóc tách trực tiếp"
                                >
                                    <i className="fa-solid fa-key text-sky-400"></i>
                                    <span>Cài đặt Gemini Key</span>
                                </button>
                            )}
                            {/* Google User Profile Indicator & Logout */}
                            {isAuthenticated && currentUser ? (
                                <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-800/90 border border-slate-700/80 rounded-xl text-xs">
                                    <img src={currentUser.picture} alt="Avatar" className="w-6 h-6 rounded-full border border-sky-400 object-cover" />
                                    <span className="font-bold text-slate-200 max-w-[120px] truncate">{currentUser.name}</span>
                                    <button onClick={handleLogout} className="ml-1 text-slate-400 hover:text-rose-400 p-1 transition" title="Đăng xuất">
                                        <i className="fa-solid fa-arrow-right-from-bracket"></i>
                                    </button>
                                </div>
                            ) : (
                                <button onClick={() => setIsAuthenticated(false)} className="px-3 py-1.5 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-sky-500/20">
                                    <i className="fa-brands fa-google"></i>
                                    <span>Đăng nhập</span>
                                </button>
                            )}
                            {/* Toggle Dashboard / Focus Mode */}
                            <div className="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs">
                                <button
                                    onClick={() => setViewMode('dashboard')}
                                    className={`px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 ${
                                        viewMode === 'dashboard' 
                                            ? 'bg-sky-500 text-white shadow-sm' 
                                            : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    <i className="fa-solid fa-table-cells"></i> Dashboard ({cards.length})
                                </button>
                                <button
                                    onClick={() => setViewMode('focus')}
                                    className={`px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 ${
                                        viewMode === 'focus' 
                                            ? 'bg-sky-500 text-white shadow-sm' 
                                            : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    <i className="fa-solid fa-crop-simple"></i> Tiêu điểm (Focus)
                                </button>
                            </div>

                            {/* Batch Generation Button */}
                            <button
                                onClick={handleBatchGenerate}
                                className="px-3.5 py-2 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-amber-500/10"
                                title="Sinh đồng thời 4 widget cùng lúc để kiểm tra độ ổn định của DOM"
                            >
                                <i className="fa-solid fa-bolt"></i> Sinh 4 Widget Cùng Lúc
                            </button>

                            {/* Add Single Widget Dropdown */}
                            <button
                                onClick={() => handleAddWidget('tangents')}
                                className="px-3.5 py-2 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-sky-500/10"
                            >
                                <i className="fa-solid fa-plus"></i> Thêm Thẻ Bài
                            </button>

                            <a 
                                href="http://localhost:8080/padlet_ai_mathboard.html" 
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold flex items-center gap-1.5 border border-slate-700 transition"
                            >
                                <i className="fa-solid fa-table-cells-large text-pink-400"></i> Padlet Trắng
                            </a>
                        </div>
                    </header>

                    {/* Gemini API Key Configuration Modal */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <div className="flex items-center gap-2">
                                        <i className="fa-solid fa-key text-sky-400"></i>
                                        <h3 className="font-bold text-white text-sm">Cài đặt Gemini API Key (Tier 1 AI)</h3>
                                    </div>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    Khóa API dùng để kích hoạt mô hình <strong>Gemini 1.5 Flash</strong> tự động bóc tách đề bài toán học thành kịch bản JSON dựng hình cho JSXGraph.
                                </p>
                                <div>
                                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">
                                        VITE_GEMINI_API_KEY
                                    </label>
                                    <input
                                        type="password"
                                        value={apiKeyInput}
                                        onChange={(e) => setApiKeyInput(e.target.value)}
                                        placeholder="Dán Gemini API Key của bạn (AIzaSy...)"
                                        className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-600 outline-none focus:border-sky-500 font-mono"
                                    />
                                </div>
                                <div className="flex items-center justify-between pt-2">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setApiKeyInput('');
                                            localStorage.removeItem('padlet_gemini_api_key');
                                            if (window.ENV) window.ENV.VITE_GEMINI_API_KEY = '';
                                            setIsSettingsOpen(false);
                                        }}
                                        className="text-xs text-rose-400 hover:text-rose-300 font-medium"
                                    >
                                        Xóa khóa API
                                    </button>
                                    <div className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setIsSettingsOpen(false)}
                                            className="px-3 py-1.5 text-xs text-slate-400 hover:text-white"
                                        >
                                            Hủy
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const trimmed = apiKeyInput.trim();
                                                if (trimmed) {
                                                    localStorage.setItem('padlet_gemini_api_key', trimmed);
                                                    if (window.ENV) window.ENV.VITE_GEMINI_API_KEY = trimmed;
                                                } else {
                                                    localStorage.removeItem('padlet_gemini_api_key');
                                                    if (window.ENV) window.ENV.VITE_GEMINI_API_KEY = '';
                                                }
                                                setIsSettingsOpen(false);
                                            }}
                                            className="px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold transition shadow-sm"
                                        >
                                            Lưu cấu hình
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}


                    {/* AI Chatbot Bar: TIER 1 INPUT (PURE DATA ONLY) */}
                    <div className="bg-slate-900/90 border-b border-slate-800/80 px-6 py-2.5 flex flex-wrap items-center justify-between gap-3 shrink-0">
                        <form onSubmit={handleAiChatbotSubmit} className="flex-1 flex items-center gap-2 max-w-3xl">
                            <div className="relative flex-1">
                                <i className="fa-solid fa-robot absolute left-3.5 top-1/2 -translate-y-1/2 text-sky-400 text-xs"></i>
                                <input
                                    type="text"
                                    value={chatPrompt}
                                    onChange={(e) => setChatPrompt(e.target.value)}
                                    placeholder="Nhập đề bài hình học (AI chỉ bóc tách JSON và gọi setCards, không can thiệp DOM)..."
                                    className="w-full pl-9 pr-4 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 outline-none focus:border-sky-500 transition shadow-inner"
                                />
                            </div>
                            <button
                                type="submit"
                                disabled={isAiProcessing || !chatPrompt.trim()}
                                className="px-4 py-2 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 disabled:opacity-50 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition shadow-sm shrink-0"
                            >
                                {isAiProcessing ? (
                                    <>
                                        <i className="fa-solid fa-spinner fa-spin"></i>
                                        <span>Đang xử lý...</span>
                                    </>
                                ) : (
                                    <>
                                        <i className="fa-solid fa-wand-magic-sparkles"></i>
                                        <span>AI Dựng Hình</span>
                                    </>
                                )}
                            </button>
                        </form>

                        {/* Prompt Suggestions */}
                        <div className="flex items-center gap-1.5 text-[11px] text-slate-400 overflow-x-auto">
                            <span className="text-slate-500 font-semibold shrink-0">Gợi ý mẫu:</span>
                            <button
                                onClick={() => handleAiChatbotSubmit(null, 'Cho tam giác vuông ABC có đường cao AH')}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg shrink-0 transition border border-slate-700/60"
                            >
                                📐 Tam giác vuông AH
                            </button>
                            <button
                                onClick={() => handleAiChatbotSubmit(null, 'Tam giác ABC nội tiếp đường tròn (O; R)')}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg shrink-0 transition border border-slate-700/60"
                            >
                                ⭕ Ngoại tiếp (O; R)
                            </button>
                            <button
                                onClick={() => handleAiChatbotSubmit(null, 'Đường tròn nội tiếp tam giác ABC')}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg shrink-0 transition border border-slate-700/60"
                            >
                                🟢 Nội tiếp tam giác
                            </button>
                            <button
                                onClick={() => handleAiChatbotSubmit(null, 'Hai tiếp tuyến cắt nhau tại M')}
                                className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg shrink-0 transition border border-slate-700/60"
                            >
                                ✂️ Tiếp tuyến cắt nhau
                            </button>
                        </div>
                    </div>
                    {/* Animated AI Status Banner */}
                    {aiStatusMsg && (
                        <div className="px-6 py-2 bg-sky-950/40 border-b border-sky-800/40 flex items-center justify-between text-xs text-sky-300 animate-fadeIn">
                            <div className="flex items-center gap-2">
                                <i className="fa-solid fa-spinner fa-spin text-sky-400"></i>
                                <span>{aiStatusMsg}</span>
                            </div>
                            <button onClick={() => setAiStatusMsg('')} className="text-slate-400 hover:text-white text-xs">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <div className="flex-1 overflow-hidden flex">
                        {viewMode === 'dashboard' ? (
                            /* ================= DASHBOARD GRID VIEW ================= */
                            <div className="flex-1 p-6 overflow-y-auto bg-slate-950">
                                <div className="mb-4 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <span className="text-sm font-bold text-white flex items-center gap-2">
                                            <i className="fa-solid fa-grip text-sky-400"></i> Các Thẻ Bài DynamicGeometryCard
                                        </span>
                                        <span className="text-xs text-slate-500 font-mono">
                                            (Khởi tạo an toàn qua useEffect & ref={'{boardRef}'})
                                        </span>
                                    </div>
                                    <div className="text-xs text-slate-400">
                                        Tổng số widget: <strong className="text-white font-mono">{cards.length}</strong>
                                    </div>
                                </div>

                                {cards.length === 0 ? (
                                    <div className="p-12 text-center rounded-2xl border border-dashed border-slate-800 bg-slate-900/50">
                                        <i className="fa-solid fa-shapes text-4xl text-slate-600 mb-3 block"></i>
                                        <p className="text-sm font-semibold text-slate-400 mb-3">Chưa có thẻ bài nào trên Dashboard.</p>
                                        <button
                                            onClick={() => handleAddWidget('right_triangle')}
                                            className="px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold transition"
                                        >
                                            Thêm thẻ bài mẫu đầu tiên
                                        </button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {cards.map(card => (
                                            <DynamicGeometryCard
                                                key={card.id}
                                                card={card}
                                                isSelected={selectedCardId === card.id}
                                                onDelete={handleDeleteCard}
                                                onTogglePin={handleTogglePin}
                                                onSelect={(id) => {
                                                    setSelectedCardId(id);
                                                    setViewMode('focus');
                                                }}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        ) : (
                            /* ================= FOCUS SINGLE VIEW ================= */
                            <div className="flex-1 flex overflow-hidden">
                                {/* Left Side: Large Interactive Canvas */}
                                <div className="flex-1 flex flex-col bg-slate-950 p-6 overflow-hidden">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center gap-2">
                                            <button
                                                onClick={() => setViewMode('dashboard')}
                                                className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition flex items-center gap-1 border border-slate-700"
                                            >
                                                <i className="fa-solid fa-arrow-left"></i> Quay lại Dashboard
                                            </button>
                                            <span className="text-xs font-bold text-white">
                                                {activeCard && activeCard.data ? activeCard.data.title : ''}
                                            </span>
                                        </div>

                                        <div className="flex items-center gap-2">
                                            {activeCard && (
                                                <button
                                                    onClick={() => handleTogglePin(activeCard.id)}
                                                    className={`px-3 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 border ${
                                                        activeCard.isPinned
                                                            ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                                                            : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                                                    }`}
                                                >
                                                    <i className="fa-solid fa-thumbtack"></i>
                                                    {activeCard.isPinned ? "Đã ghim vị trí" : "Ghim vị trí"}
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* Focus Canvas */}
                                    <div className="flex-1 rounded-2xl bg-slate-900 border border-slate-800 overflow-hidden relative shadow-2xl">
                                        {activeCard && (
                                            <DynamicGeometryCard
                                                key={'focus-' + activeCard.id}
                                                card={{
                                                    ...activeCard,
                                                    id: 'focus-' + activeCard.id
                                                }}
                                                isSelected={true}
                                            />
                                        )}
                                    </div>
                                </div>

                                {/* Right Side: Code Editor & Quick Template Switcher */}
                                <div className="w-[420px] bg-slate-900 border-l border-slate-800 flex flex-col overflow-hidden shrink-0">
                                    <div className="p-4 border-b border-slate-800">
                                        <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">
                                            Chọn Thẻ Bài Khác
                                        </label>
                                        <div className="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                                            {cards.map(c => (
                                                <button
                                                    key={c.id}
                                                    onClick={() => setSelectedCardId(c.id)}
                                                    className={`w-full text-left px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-between ${
                                                        selectedCardId === c.id 
                                                            ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40' 
                                                            : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                                    }`}
                                                >
                                                    <span className="truncate">{c.data ? c.data.title : c.title}</span>
                                                    {c.isPinned && <i className="fa-solid fa-thumbtack text-amber-400 text-[10px]"></i>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* JSON Steps Editor */}
                                    <div className="flex-1 flex flex-col p-4 overflow-hidden">
                                        <div className="flex items-center justify-between mb-2">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                                                <i className="fa-solid fa-code text-sky-400"></i>
                                                Kịch bản JSON (props.card.data.steps)
                                            </label>
                                            <button 
                                                onClick={handleApplyJson}
                                                className="px-3 py-1 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm"
                                            >
                                                <i className="fa-solid fa-play text-[10px]"></i> Áp dụng
                                            </button>
                                        </div>

                                        <div className="flex-1 relative rounded-xl border border-slate-800 bg-slate-950 overflow-hidden">
                                            <textarea
                                                value={jsonEditorContent}
                                                onChange={(e) => setJsonEditorContent(e.target.value)}
                                                className="w-full h-full bg-transparent text-slate-300 font-mono text-[11px] p-3 outline-none resize-none leading-relaxed"
                                                spellCheck="false"
                                            />
                                        </div>

                                        {jsonError && (
                                            <div className="mt-2 p-2 bg-rose-500/10 border border-rose-500/30 rounded-lg text-rose-400 text-xs font-mono">
                                                ⚠️ Lỗi: {jsonError}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
